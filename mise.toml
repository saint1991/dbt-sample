[env]
DO_NOT_TRACK = "1"

[tools]
python = "3.14.9"
uv = "0.13.5"

[tasks.build]
description = "Build dbt models and run tests"
dir = "{{ config_root }}"
run = "uv run --locked dbt build --profiles-dir ."

[tasks.charts]
description = "Serve the CRM conversion dashboard"
depends = ["build"]
dir = "{{ config_root }}"
run = "uvx --python 3.14 --from dbt-charts==0.10.0 dct serve --port 8081"

[tasks.lineage]
description = "Generate column-level lineage with strict static analysis"
dir = "{{ config_root }}"
run = "uv run --locked dbt compile --generate-info-schema --static-analysis strict --profiles-dir ."

[tasks.mcp]
description = "Start dbt MCP with local CLI and Semantic Layer tools"
dir = "{{ config_root }}"
raw = true
run = "uv run --locked dbt-mcp"

[tasks.mcp.env]
MCP_TRANSPORT = "stdio"
DBT_PROJECT_DIR = "{{ config_root }}"
DBT_PROFILES_DIR = "{{ config_root }}"
DBT_PATH = "{{ config_root }}/.venv/bin/dbt"
DBT_MCP_ENABLE_DBT_CLI = "true"
DBT_MCP_ENABLE_SEMANTIC_LAYER = "true"
# dbt-mcp reads DBT_HOST, DBT_PROD_ENV_ID and DBT_TOKEN from .env.
# See .env.example for the dbt Platform connection settings.
